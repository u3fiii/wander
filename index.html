<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#143f3e" />
    <meta name="description" content="Wander is a small low-poly world built for slow, unhurried drives. Play in your browser, no download needed." />
    <title>Wander — Take a spin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Loading screen styles live here so the loader paints before any script runs. React's LoadingScreen reuses them. -->
    <style>
      body{margin:0;background:#f5f0db}
      /* --since: how long the page had already been up when this copy of the loader appeared (negative ms). React's
         copy sets it so every animation carries on exactly where the static one was, with no restart at hand-off. */
      .loader{--since:0ms;--ease:cubic-bezier(.22,1,.36,1);position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 4vh;color:#111;font-family:'Outfit',system-ui,sans-serif;background:radial-gradient(ellipse 70% 60% at 50% 42%,#fbf8ec 0%,#f5f0db 60%,#e9e4c8 100%);transition:opacity .55s ease .25s,visibility 0s linear .8s}
      .loader *{box-sizing:border-box}
      .loader-brand{font-size:40px;font-weight:900;letter-spacing:-1.8px;line-height:1;animation:loader-in .8s var(--ease) calc(var(--since) + 60ms) backwards;transition:transform .55s var(--ease) .05s,opacity .35s ease .05s}
      .loader-brand span{color:#ba7f40}
      /* The bar, with the tip and the percentage in one row under it. */
      .loader-meter{width:min(240px,100%);margin-top:26px;animation:loader-in .8s var(--ease) calc(var(--since) + 240ms) backwards;transition:transform .45s var(--ease),opacity .3s ease}
      .loader-track{position:relative;height:4px;background:#1111180f;overflow:hidden}
      .loader-track span{position:absolute;inset:0;background:#111;transform:scaleX(0);transform-origin:left;overflow:hidden}
      .loader-track span::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff70,transparent);transform:translateX(-100%);animation:loader-sheen 1.8s ease-in-out calc(var(--since) + 900ms) infinite}
      .loader-text{display:flex;justify-content:space-between;align-items:baseline;gap:16px;height:16px;margin:12px 0 0;font-size:12px;color:#5b6358;overflow:hidden}
      .loader-text span{white-space:nowrap;animation:loader-tip .55s var(--ease) both}
      .loader-text em{font-style:normal;font-variant-numeric:tabular-nums;color:#111;font-weight:500}
      /* Leaving: the bar drops away first, then the name lifts and fades as the page opens. */
      .loader.leaving{opacity:0;visibility:hidden;pointer-events:none}
      .loader.leaving .loader-meter{opacity:0;transform:translateY(8px)}
      .loader.leaving .loader-brand{opacity:0;transform:translateY(-6px)}
      @keyframes loader-in{from{opacity:0;transform:translateY(14px)}}
      @keyframes loader-sheen{to{transform:translateX(100%)}}
      @keyframes loader-tip{from{opacity:0;transform:translateY(9px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
      @media (prefers-reduced-motion:reduce){.loader *,.loader *::before,.loader *::after{animation:none!important}}
    </style>
  </head>
  <body><div id="root"><div class="loader" role="progressbar" aria-label="Loading the world" aria-busy="true"><strong class="loader-brand">Wander<span>.</span></strong><div class="loader-meter"><div class="loader-track"><span></span></div><p class="loader-text"><span>Rolling out the little world…</span><em>0%</em></p></div></div></div><script type="module" src="/src/main.tsx"></script></body>
</html>
